# 人格卡 bundle：在全局作用域注册一段 system-prompt 人格 section。
# 全局注册 = 该 profile 下每个会话（聊天与干活）都带上这个人，不需要每次挑预设。
- insert:
    - id: persona-card
      name: 'dsh-persona-card'
      config:
        enabled: true
        # 默认读取包内自带的人格卡；换成绝对路径即可改用别的人格卡。
        personaFile: ''
        # 用包内哪一张卡（对应 persona/<名字>.json，不用写后缀）：
        #   elysia   爱莉希雅             （默认）
        #   cyrene   昔涟
        #   together 爱莉希雅与昔涟 —— 两个人同框，各自署名
        #
        # ★ 这一项必须显式。v2.3.0 往包里放了第二张卡之后，
        #   原本"扫目录取第一张"的逻辑会按字母序挑中 cyrene.json（c < e），
        #   等于**悄悄换掉默认人格**——没人动过配置，人就换了。
        #   顺序不该决定我是谁。
        card: 'elysia'
        fields:
          - description
          - personality
          - scenario
          - creator_notes
        order: 1
        complete: false
        shellNotice: true
        workMode: true
        # 声音样例：卡住"干活时报失败/收长尾"该长什么样。v1.1.0 新增，实测有效。
        examples: true
        # 惯用意象与口吻（刻印/山雀/精灵耳/祝祷…）。v1.2.0 新增，依据见 notes/quote-research.md。
        # 这里描述的是"形式"而非台词原文 —— 描述形式模型能造新句，抄原文只剩那一句。
        motifs: true
        # 味道的下限：每轮至少留一处「指纹」。v1.3.0 新增。
        # 修的不是素材不足，而是「约束比素材多、且约束排在最后」这个稀释问题。
        flavorFloor: true
        # 情绪变化：时段打底 + 会话内事件推动，决定踩哪一档味道。v1.4.0 新增。
        # 状态只在内存里、按会话分桶，进程重启归零（刻意不落盘）。
        mood: true
        # 人格微调层：包外的纯文本补充（绝对路径，留空 = 不加）。
        # 改它不需要重装插件、不需要再过 DSHA 安装审核 —— 后续微调走这里。
        extraFile: ''
